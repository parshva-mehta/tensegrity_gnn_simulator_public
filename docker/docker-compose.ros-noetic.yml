# ROS Noetic + rosbridge for consuming EKF state published by
# sim_data_publisher.py. See docs/ekf_ros_integration_design.md.
#
# The image is defined by the Dockerfile in the companion catkin workspace
# (https://github.com/parshva-mehta/catkin_ws), which already installs
# ros-noetic-rosbridge-server and ros-noetic-foxglove-bridge and whose CMD
# (/usr/local/bin/start_bridges.sh) starts roscore + rosbridge (9090) +
# foxglove_bridge (8765). This compose file only wraps that image's documented
# `docker run` invocation, so it deliberately does not override the command.
#
# Point CATKIN_WS at your catkin_ws checkout; it is mounted at /ws, matching the
# workspace path baked into the image (ENV CATKIN_WS=/ws) and the volume mount in
# the workspace's instruction.md.
#
#   # build the image from the catkin_ws checkout, then run
#   CATKIN_WS=../catkin_ws docker compose \
#     -f docker/docker-compose.ros-noetic.yml up --build
#
#   # or run an image you already built as `tensegrity:noetic`
#   CATKIN_WS=../catkin_ws docker compose \
#     -f docker/docker-compose.ros-noetic.yml up --no-build
#
# Then, from this repo's Python env (no ROS needed):
#   export ROSBRIDGE_URL=ws://localhost:9090
#   python3 -c "from sim_data_publisher import RodStatePublisher; ..."
#
# Verify messages are arriving:
#   docker compose -f docker/docker-compose.ros-noetic.yml exec ros-noetic \
#     bash -lc 'rostopic echo /tensegrity/rod_01/odom'

services:
  ros-noetic:
    # Matches the tag used in the catkin workspace's instruction.md.
    image: ${ROS_IMAGE:-tensegrity:noetic}
    build:
      context: ${CATKIN_WS:-../catkin_ws}
      dockerfile: ${CATKIN_WS_DOCKERFILE:-Dockerfile}
    # The image is amd64-only (GTSAM + LibTorch CPU wheels); required on Apple
    # Silicon, harmless elsewhere.
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: tensegrity-ros-noetic
    # The catkin workspace is mounted, not copied: the Dockerfile creates an
    # empty /ws/src and expects the sources at runtime.
    volumes:
      - ${CATKIN_WS:-../catkin_ws}:/ws
    ports:
      # rosbridge websocket. A publisher on the host uses ws://localhost:9090;
      # a sibling container uses ws://ros-noetic:9090 on this network.
      - "${ROSBRIDGE_PORT:-9090}:9090"
      # foxglove_bridge, also started by start_bridges.sh.
      - "${FOXGLOVE_PORT:-8765}:8765"
    stdin_open: true
    tty: true
    networks:
      - tensegrity

networks:
  tensegrity:
    driver: bridge
